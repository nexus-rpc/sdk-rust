[package]
name = "nexus-rpc-macros"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
description = "Procedural macros for the minimal Nexus Rust SDK"
repository = "https://github.com/nexus-rpc/sdk-rust"
homepage = "https://github.com/nexus-rpc/sdk-rust"
documentation = "https://docs.rs/nexus-rpc-macros"
exclude = ["tests/fixtures/**", "tests/ui/pass/temporal_extension.rs"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

[dev-dependencies]
futures = "0.3"
trybuild = "1"
temporal-extension = { path = "tests/fixtures/temporal-extension" }

[lints]
workspace = true
