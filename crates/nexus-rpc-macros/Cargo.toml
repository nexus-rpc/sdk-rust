[package]
name = "nexus-rpc-macros"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
description = "Procedural macros for Nexus service definitions and typed operation markers"
repository = "https://github.com/nexus-rpc/sdk-rust"
homepage = "https://github.com/nexus-rpc/sdk-rust"
documentation = "https://docs.rs/nexus-rpc-macros"

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

[lints]
workspace = true
