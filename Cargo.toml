[workspace]
members = ["crates/nexus-rpc", "crates/nexus-rpc-macros"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92.0"
license = "MIT"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
